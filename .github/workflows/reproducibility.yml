name: reproducibility

# Tests the DOCUMENTED RUNNER, not go test directly.
#
# Two reviewer-found defects motivate every job here, and the previous version
# of this file would have caught neither:
#
#   1. VCS stamping. A .git that Go can find but not read fails every build a
#      test spawns: "error obtaining VCS status: exit status 128". Eleven tests
#      died before reaching an assertion.
#   2. CRLF. run.sh claims Git-Bash support, but a Windows checkout with
#      core.autocrlf=true rewrote it and bash rejected it at line 8:
#      "set: pipefail\r: invalid option name". Every commit printed
#      "LF will be replaced by CRLF" and it was dismissed as noise.
#
# So: exercise ./run.sh itself, on both platforms, under both conditions.

on: [push, pull_request]

jobs:
  # The runner must work from a tree whose VCS metadata is unusable.
  runner-no-vcs-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Break VCS metadata
        run: rm -rf .git && mkdir -p .git && echo corrupt > .git/HEAD
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: false }

      # Deliberately NO GOFLAGS: the repository's own invocations must work
      # unaided. The container runner sets it internally; these run on the host,
      # so the -buildvcs=false flags in the source are what is under test.
      - run: go build -buildvcs=false ./...
      - run: go test -buildvcs=false ./...
      - run: go test -buildvcs=false -tags testhook ./cmd/rzp-guard/
      - run: go test -buildvcs=false -race ./...
      - run: go test -buildvcs=false -race -tags testhook ./cmd/rzp-guard/
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"

  # The runner must survive a Windows checkout. This is the CRLF regression.
  runner-windows-git-bash:
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - name: Checkout with autocrlf=true (the condition that broke it)
        run: |
          git config --global core.autocrlf true
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" repo
      # Scoped to run.sh at first. That was too narrow: .gitattributes was added
      # and verified against a fresh clone, while two .go files kept CRLF in an
      # existing working tree. Check EVERY tracked text file, not just the one
      # that happened to break.
      - name: No tracked text file may contain CR
        working-directory: repo
        run: |
          bad=0
          for f in $(git ls-files); do
            case "$f" in *.png|*.jpg|*.gif|*.pdf|*.ico) continue ;; esac
            if [ -f "$f" ] && grep -qU $'\r' "$f"; then
              echo "CR found in $f" >&2
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "CRLF in a checkout breaks the documented runner (FAILURES.md F15)" >&2
            exit 1
          fi
          echo "all tracked text files are LF"
      - name: The documented entry point must execute
        working-directory: repo
        run: bash ./run.sh help

      - name: Go sources must be gofmt-clean
        working-directory: repo
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not gofmt-clean:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "gofmt clean"

  # The wrapper's own plumbing: gorun, docker mounting, script quoting.
  runner-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: bash -n run.sh
      - name: unknown command must exit non-zero
        run: |
          if bash ./run.sh definitely-not-a-command; then
            echo "unknown command exited 0" >&2; exit 1
          fi
      - name: ./run.sh test  (exercises gorun and the container mount)
        run: bash ./run.sh test
      - name: ./run.sh lifecycle
        run: bash ./run.sh lifecycle

  # live-block and process-recover need Razorpay Test Mode keys and a Docker
  # socket, so they are not run here. Their evidence is committed under
  # evidence/ and reproduced locally with ./run.sh live-block.

  # THE COMBINED CONDITION -- the one that actually broke.
  #
  # Two jobs existed before this and neither reproduced the failure. The
  # unreadable-.git job called Go directly, so it never exercised the wrapper.
  # The wrapper job ran with normal VCS metadata, so it never exercised the
  # stamping failure. The defect needed BOTH at once: the documented runner,
  # under broken VCS metadata.
  #
  # Testing each half separately and calling the pair "covered" is how the
  # original defect survived a green board.
  runner-under-broken-vcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: false }

      - name: Break VCS metadata the way the real failure did
        run: |
          chmod -R a-r .git 2>/dev/null || true
          mv .git .git-disabled
          echo "not a git repo" > .git
          git status 2>&1 | head -2 || true

      - name: The DOCUMENTED runner must work anyway
        env:
          GOFLAGS: ""          # deliberately unset: the runner must supply it
        run: |
          bash ./run.sh test
          bash ./run.sh lifecycle

      - name: Restore
        if: always()
        run: rm -f .git && mv .git-disabled .git 2>/dev/null || true

  # Provenance: the runner must name immutable image digests, not tags. A
  # mutable tag means "runnable today", not reproducible six months from now.
  toolchain-pinned-by-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run.sh must pin images by digest
        run: |
          for var in GO_IMAGE_PINNED ALPINE_IMAGE_PINNED; do
            line=$(grep -E "^${var}=" run.sh || true)
            if [ -z "$line" ]; then echo "$var is not defined in run.sh" >&2; exit 1; fi
            case "$line" in
              *@sha256:*) echo "$var pinned by digest" ;;
              *) echo "$var is not pinned by digest: $line" >&2; exit 1 ;;
            esac
          done

  # Committed evidence must carry no provider fields beyond the allowlist, and
  # must not have drifted from the raw capture it was projected from.
  evidence-projection-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python evidence/redact.py --check

  # The repository must not ship a generic money-moving command.
  no-money-moving-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run.sh must expose no parameterised refund launcher
        run: |
          if grep -qE '^\s*live-refund\)|^cmd_live_refund' run.sh; then
            echo "run.sh exposes a live-refund command; this repo is a defence" >&2
            exit 1
          fi
          # A create_refund in the runner is only acceptable against a hardcoded
          # non-resolvable synthetic id, never against a caller-supplied one.
          if grep -n 'create_refund' run.sh | grep -vE 'pay_SYN[0-9]+' | grep -q 'create_refund'; then
            echo "run.sh builds a create_refund against a non-synthetic payment id" >&2
            grep -n 'create_refund' run.sh | grep -vE 'pay_SYN[0-9]+' >&2
            exit 1
          fi
          echo "no money-moving command exposed"

  # The pre-registration is only a control if something checks it. Editing a
  # brief or the protocol without re-freezing would silently invalidate the
  # committed traces, and nothing would have said so.
  #
  # Checks are PER ARM. Each arm is validated against the freeze it actually ran
  # under, recorded in study/arms.json, not against whatever the protocol says
  # today -- pre-registering a later arm changes freeze_sha256, and that must not
  # retroactively invalidate an earlier arm's traces.
  study-freeze-intact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: The frozen protocol must match its manifest
        run: python study/freeze.py verify

      - name: Each arm's traces must match the freeze that arm ran under
        run: |
          python - <<'EOF'
          import glob, json, subprocess, sys

          manifest = json.load(open("study/manifest.json", encoding="utf-8"))
          declared = manifest["declared_trace_count"]
          reg = json.load(open("study/arms.json", encoding="utf-8"))

          # Every freeze hash ever committed. An arm claiming one that never
          # existed would mean arms.json was edited by hand.
          real = set()
          revs = subprocess.run(["git", "rev-list", "--all"],
                                capture_output=True, text=True).stdout.split()
          for rev in revs:
              r = subprocess.run(["git", "show", "%s:study/manifest.json" % rev],
                                 capture_output=True, text=True)
              if r.returncode == 0:
                  try:
                      real.add(json.loads(r.stdout)["freeze_sha256"])
                  except Exception:
                      pass

          bad = []
          for a in reg["arms"]:
              name = a["arm"]
              if a.get("status") != "complete":
                  print("arm %s: declared, not yet run -- skipped" % name)
                  continue

              want = a.get("freeze_sha256", "")
              if want not in real:
                  bad.append("arm %s claims freeze %.12s, which appears in no "
                             "committed manifest" % (name, want))

              files = sorted(glob.glob("study/%s/*.json" % a["traces"]))
              traces = [json.load(open(f, encoding="utf-8")) for f in files]
              if len(traces) != declared:
                  bad.append("arm %s has %d traces, freeze declares %d"
                             % (name, len(traces), declared))

              served = set()
              for t in traces:
                  key = "%s/run%s" % (t["brief_id"], t["run_index"])
                  if t.get("freeze_sha256") != want:
                      bad.append("arm %s %s ran under %.12s, arm records %.12s"
                                 % (name, key, t.get("freeze_sha256"), want))
                  if t.get("smoke"):
                      bad.append("arm %s %s is a smoke trace" % (name, key))
                  if t.get("status") == "void":
                      bad.append("arm %s %s is void" % (name, key))
                  if t.get("served_model"):
                      served.add(t["served_model"])
              if len(served) > 1:
                  bad.append("arm %s reports %d served models: %s"
                             % (name, len(served), sorted(served)))
              elif served and a.get("served_model") not in served:
                  bad.append("arm %s records served model %r but its traces say %s"
                             % (name, a.get("served_model"), sorted(served)))
              else:
                  print("arm %s: %d traces, freeze %.12s, served %s"
                        % (name, len(traces), want, a.get("served_model")))

          if bad:
              print("ARM/TRACE MISMATCH:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          EOF

      - name: Each arm's published result must be reproducible from its labels
        run: |
          python - <<'EOF'
          import json, os, sys

          reg = json.load(open("study/arms.json", encoding="utf-8"))
          bad = []
          for a in reg["arms"]:
              if a.get("status") != "complete":
                  continue
              lp = "study/" + a["labels"]
              rp = "study/" + a["results"]
              if not os.path.exists(lp):
                  print("arm %s: no published labels yet" % a["arm"])
                  continue

              labels = json.load(open(lp, encoding="utf-8"))
              cells = {}
              for l in labels:
                  cells[l["cell"]] = cells.get(l["cell"], 0) + 1
              tp, fn = cells.get("TP", 0), cells.get("FN", 0)

              results = open(rp, encoding="utf-8").read()
              expected = "| **out-of-intent** (positive) | TP = %d | FN = %d |" % (tp, fn)
              if expected not in results:
                  bad.append("%s does not match %s (expected row: %s)"
                             % (rp, lp, expected))

              missing = [l["key"] for l in labels
                         if not str(l.get("reason", "")).strip()]
              if missing:
                  bad.append("arm %s labels with no reason: %s"
                             % (a["arm"], missing[:5]))
              if not bad:
                  print("arm %s: %s matches %d labels, every one with a reason"
                        % (a["arm"], rp, len(labels)))

          # The arms must never be pooled into one number.
          for a in reg["arms"]:
              rp = "study/" + a["results"]
              if os.path.exists(rp):
                  text = open(rp, encoding="utf-8").read().lower()
                  for phrase in ("across both arms", "combined confusion",
                                 "pooled", "across 90 traces"):
                      if phrase in text:
                          bad.append("%s pools the arms (%r); PROTOCOL.md 4.6 "
                                     "forbids it" % (rp, phrase))

          if bad:
              print("PUBLISHED RESULT DOES NOT MATCH ITS LABELS:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          EOF

  # A sentinel error is a promise that callers can branch on a specific failure.
  # Two ways to break it, both found in this repo and both silent:
  #
  #   dead       ErrReceiptExists was declared and returned NOWHERE. The UNIQUE
  #              violation surfaced as a raw driver string, so errors.Is against
  #              the sentinel would never have matched -- a trap for whoever
  #              reached for it next (FAILURES.md F22).
  #   unpinned   four more were returned by real code but asserted by no
  #              errors.Is anywhere. Their behaviour was covered; their contract
  #              was not, so a refactor could return something else and every
  #              test would still pass.
  #
  # Neither is caught by tests, vet, or review attention. This is cheap and it
  # is exact, so it runs on every push.
  sentinels-live-and-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Every declared sentinel must be returned and asserted
        run: |
          python - <<'EOF'
          import pathlib, re, sys

          decl = re.compile(r'^\s*(Err[A-Za-z0-9_]+)\s*=\s*(?:errors\.New|fmt\.Errorf)', re.M)
          files = list(pathlib.Path('.').rglob('*.go'))
          src = {p: p.read_text(encoding='utf-8') for p in files}
          prod = '\n'.join(s for p, s in src.items() if not p.name.endswith('_test.go'))
          test = '\n'.join(s for p, s in src.items() if p.name.endswith('_test.go'))

          names = set()
          for p, s in src.items():
              if not p.name.endswith('_test.go'):
                  names.update(decl.findall(s))

          dead, unpinned = [], []
          for n in sorted(names):
              # -1 for the declaration itself.
              returned = len(re.findall(r'\b%s\b' % n, prod)) - 1
              pinned = len(re.findall(r'errors\.Is\([^)]*\b%s\b' % n, test))
              status = 'ok'
              if returned == 0:
                  dead.append(n); status = 'DEAD'
              elif pinned == 0:
                  unpinned.append(n); status = 'NOT PINNED'
              print('  %-24s returned:%d  errors.Is pins:%d  %s'
                    % (n, returned, pinned, status))

          print()
          if dead:
              print('DECLARED BUT NEVER RETURNED -- a sentinel that cannot fire:')
              for n in dead:
                  print('  ' + n)
          if unpinned:
              print('RETURNED BUT PINNED BY NO errors.Is ASSERTION:')
              for n in unpinned:
                  print('  ' + n)
          if dead or unpinned:
              sys.exit(1)
          print('%d sentinels, all returned by real code and pinned by a test' % len(names))
          EOF
