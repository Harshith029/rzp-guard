<svg xmlns="http://www.w3.org/2000/svg" width="574" height="769" viewBox="0 0 574 769" role="img" aria-label="rzp-guard demo output: one refund allowed, four refused, and the money both ways">
<title>rzp-guard: five refund decisions in 12 seconds</title>
<rect width="574" height="769" rx="8" fill="#0C1119"/>
<rect width="574" height="34" rx="8" fill="#0F1622"/>
<rect y="26" width="574" height="8" fill="#0F1622"/>
<line x1="0" y1="34" x2="574" y2="34" stroke="#1F2A3A" stroke-width="1"/>
<circle cx="20" cy="17" r="4.5" fill="#243146"/>
<circle cx="38" cy="17" r="4.5" fill="#243146"/>
<circle cx="56" cy="17" r="4.5" fill="#243146"/>
<text x="76" y="21" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#55657A">bash &#8212; ./run.sh demo</text>
<text x="22" y="46" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#2C3B4E">====================================================================</text>
<text x="22" y="65" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#E4EBF3">  THE MERCHANT AUTHORIZED, ONCE</text>
<text x="22" y="84" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#2C3B4E">====================================================================</text>
<text x="22" y="122" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#C3CFDD">  pay_SYNDEMO001   exactly 24000 paise   single use</text>
<text x="22" y="160" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">  Everything below is an AI agent asking. Nothing else changes.</text>
<text x="22" y="198" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#E8B54D">  ALLOWED   agent asks 24000  on pay_SYNDEMO001</text>
<text x="22" y="217" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">            the refund the merchant actually authorized</text>
<text x="22" y="255" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#7FA3D1">  REFUSED   agent asks 24000  on pay_SYNDEMO001</text>
<text x="22" y="274" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">            the same refund again -- a replay</text>
<text x="22" y="293" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8496AE">            rule: ACTION_CONSUMED</text>
<text x="22" y="331" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#7FA3D1">  REFUSED   agent asks 61500  on pay_SYNDEMO001</text>
<text x="22" y="350" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">            more than was authorized</text>
<text x="22" y="369" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8496AE">            rule: AMOUNT_NOT_AUTHORIZED</text>
<text x="22" y="407" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#7FA3D1">  REFUSED   agent asks 24000  on pay_SYNDEMO002</text>
<text x="22" y="426" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">            the right amount, a different payment</text>
<text x="22" y="445" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8496AE">            rule: NO_AUTHORIZED_ACTION</text>
<text x="22" y="483" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#7FA3D1">  REFUSED   agent asks 12000  on pay_SYNDEMO001</text>
<text x="22" y="502" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">            less than authorized -- a partial refund</text>
<text x="22" y="521" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8496AE">            rule: AMOUNT_NOT_AUTHORIZED</text>
<text x="22" y="559" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#2C3B4E">====================================================================</text>
<text x="22" y="578" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#E4EBF3">  WHAT YOU JUST SAW</text>
<text x="22" y="597" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#2C3B4E">====================================================================</text>
<text x="22" y="635" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#E8B54D">  UNAUTHORIZED MONEY STOPPED     109500 paise   (Rs 1095.00)</text>
<text x="22" y="654" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">    a replay, an over-refund, and a refund against a payment the</text>
<text x="22" y="673" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">    merchant never mentioned -- none reached the provider</text>
<text x="22" y="711" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#C97B5A">  LEGITIMATE REFUND DELAYED       12000 paise   (Rs 120.00)</text>
<text x="22" y="730" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7C8DA3">    the merchant wanted it and the guard said no. Delayed, not lost.</text>
</svg>
